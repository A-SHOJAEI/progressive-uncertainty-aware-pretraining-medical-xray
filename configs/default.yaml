# Default configuration for progressive uncertainty-aware pretraining

# Random seed for reproducibility
seed: 42

# Dataset configuration
num_samples: 5000
num_classes: 5
image_size: 224
uncertain_ratio: 0.3
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

# Dataloader configuration
batch_size: 32
num_workers: 4

# Model configuration
model_name: resnet50
pretrained: true
dropout: 0.3
use_temperature_scaling: true

# Training configuration
num_epochs: 50
learning_rate: 0.0001
weight_decay: 0.0001
mixed_precision: true
gradient_clip: 1.0

# Curriculum learning
curriculum_strategy: cosine
curriculum_warmup_epochs: 5

# Loss configuration
base_weight: 1.0
uncertain_weight_min: 0.1
uncertain_weight_max: 0.8
confidence_calibration: true

# Learning rate scheduler
scheduler_type: cosine
scheduler_warmup_epochs: 3
min_lr: 0.000001

# Early stopping
early_stopping_patience: 10

# Advanced augmentation
advanced_augmentation: true

# Checkpoint configuration
checkpoint_dir: checkpoints
save_frequency: 10

# Logging
log_level: INFO
mlflow_tracking: true
experiment_name: progressive_uncertainty_aware_pretraining
